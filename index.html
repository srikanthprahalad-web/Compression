<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laxmi TVS - PDF Compressor</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: #1e293b;
      padding: 30px;
      border-radius: 12px;
      text-align: center;
      width: 320px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    input {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border-radius: 6px;
      border: none;
    }

    button {
      margin-top: 15px;
      padding: 10px;
      width: 100%;
      border: none;
      border-radius: 6px;
      background: #22c55e;
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    .hidden {
      display: none;
    }

    .note {
      font-size: 12px;
      margin-top: 10px;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <!-- LOGIN SCREEN -->
  <div id="loginBox" class="box">
    <h2>🔒 Laxmi TVS Access</h2>
    <p>Authorized use only</p>

    <input type="password" id="password" placeholder="Enter password" />
    <button onclick="checkPassword()">Access</button>

    <div class="note">
      This tool is restricted for <b>Laxmi TVS internal use only</b>.
    </div>
  </div>

  <!-- MAIN APP -->
  <div id="appBox" class="box hidden">
    <h2>📄 PDF Compressor</h2>
    <p style="font-size:12px;">Laxmi TVS Internal Tool</p>

    <input type="file" id="fileInput" accept="application/pdf" />
    <button onclick="compressPDF()">Compress</button>

    <div class="note">
      Target: File size below 250 KB
    </div>
  </div>

  <script>
    const PASSWORD = "laxmitvs@2026"; // 👉 CHANGE THIS

    function checkPassword() {
      const input = document.getElementById("password").value;

      if (input === PASSWORD) {
        document.getElementById("loginBox").classList.add("hidden");
        document.getElementById("appBox").classList.remove("hidden");
      } else {
        alert("Incorrect password");
      }
    }

    function compressPDF() {
      alert("Use your existing compression script here");
    }
  </script>

</body>
</html>
